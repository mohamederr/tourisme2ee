spring.application.name=Tourisme 2E

# ===============================
# SERVEUR
# ===============================
server.port=8080
server.servlet.context-path=/api/v1

# ===============================
# BASE DE DONNEES (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/tourisme2e_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:changeMeInProductionWithALongRandomBase64Secret}
jwt.expiration=86400000

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.ma.tourisme2e=DEBUG

# ===============================
# JACKSON (format JSON / dates ISO 8601)
# ===============================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ===============================
# UPLOAD DE FICHIERS (photos offres)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
